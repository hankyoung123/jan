name: Story Engine Linux Flatpak

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version label for the artifact
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: Version label for the artifact
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-linux-flatpak:
    name: Build unsigned Story Engine Flatpak
    runs-on: ubuntu-22.04
    env:
      STORY_ENGINE_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install build and Flatpak dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            flatpak \
            flatpak-builder \
            libappindicator3-dev \
            libatk1.0-dev \
            libfuse2 \
            libglib2.0-dev \
            libgtk-3-dev \
            libpango1.0-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install locked JavaScript and Python dependencies
        run: |
          corepack enable
          yarn install --immutable
          python -m pip install uv==0.11.6
          uv sync --frozen --project apps/story-engine --extra packaging

      - name: Build the Story Engine Tauri Debian bundle
        run: |
          yarn build:sidecar
          yarn build:icon
          yarn copy:assets:tauri
          yarn build:cli
          yarn download:bin
          yarn build:web
          yarn tauri build --bundles deb --ci

      - name: Stage the Tauri bundle for Flatpak
        run: |
          set -euo pipefail
          deb_file="$(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb_file"
          mkdir -p .build/flatpak-stage
          dpkg-deb -x "$deb_file" .build/flatpak-stage
          test -x .build/flatpak-stage/usr/bin/story-engine-desktop
          test -x .build/flatpak-stage/usr/lib/story-engine-desktop/resources/story-engine/story-engine
          test -f .build/flatpak-stage/usr/lib/story-engine-desktop/THIRD_PARTY_NOTICES.md
          test -f .build/flatpak-stage/usr/lib/story-engine-desktop/licenses/AGPL-3.0.txt
          test -f .build/flatpak-stage/usr/lib/story-engine-desktop/licenses/Concordia-2.4.0-APACHE-2.0.txt

      - name: Build the unsigned Story Engine Flatpak
        run: |
          flatpak-builder \
            --force-clean \
            --disable-rofiles-fuse \
            --repo=.build/flatpak-repo \
            .build/flatpak-build \
            flatpak/com.storyengine.desktop.yml
          flatpak build-bundle \
            .build/flatpak-repo \
            "Story Engine_${STORY_ENGINE_VERSION}.flatpak" \
            com.storyengine.desktop

      - name: Smoke-test Flatpak install and uninstall
        run: |
          set -euo pipefail
          artifact="Story Engine_${STORY_ENGINE_VERSION}.flatpak"
          flatpak --user install --noninteractive --assumeyes --bundle "$artifact"
          flatpak info --user com.storyengine.desktop
          flatpak --user uninstall --noninteractive --assumeyes com.storyengine.desktop
          if flatpak info --user com.storyengine.desktop >/dev/null 2>&1; then
            echo 'Story Engine Flatpak remained installed after uninstall' >&2
            exit 1
          fi

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: story-engine-linux-flatpak-${{ inputs.version }}
          path: Story Engine_${{ inputs.version }}.flatpak

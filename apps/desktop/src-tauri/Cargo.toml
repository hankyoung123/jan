[package]
name = "story-engine-desktop"
version = "0.1.0"
description = "AI Story Evolution Engine Next desktop shell"
authors = ["AI Story Evolution Engine contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "story_engine_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["time"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
